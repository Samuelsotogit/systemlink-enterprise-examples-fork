#      Deployment branches -> add 'main'

name: Deploy Blazor to GitHub Pages

on:
  push:
    branches:
      - blazor-pages
      - main
    paths:
      - "examples/Web Applications/Framework Examples/Blazor/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0

      - name: Restore dependencies
        working-directory:
          "examples/Web Applications/Framework
          Examples/Blazor/BlazorWasmAuthExample"
        run: dotnet restore

      - name: Publish Blazor app
        working-directory:
          "examples/Web Applications/Framework
          Examples/Blazor/BlazorWasmAuthExample"
        run: dotnet publish BlazorWasmAuthExample.csproj -o dist

      - name: Copy fingerprinted dotnet.js
        working-directory:
          "examples/Web Applications/Framework
          Examples/Blazor/BlazorWasmAuthExample"
        run: |
          MANIFEST=$(find dist -maxdepth 1 -name "*.staticwebassets.endpoints.json" | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "ERROR: No staticwebassets.endpoints.json found in dist/"
            exit 1
          fi
          DOTNET_JS=$(grep -o '"Route":"_framework/dotnet\.js","AssetFile":"_framework/[^"]*\.js"' "$MANIFEST" \
            | grep -v '\.js\.br"' | grep -v '\.js\.gz"' | head -1 \
            | sed 's/.*"AssetFile":"_framework\/\(.*\)"/\1/')
          if [ -z "$DOTNET_JS" ]; then
            echo "ERROR: Could not locate fingerprinted dotnet.js in manifest"
            exit 1
          fi
          echo "==> Copying $DOTNET_JS -> dotnet.js"
          cp "dist/wwwroot/_framework/$DOTNET_JS" "dist/wwwroot/_framework/dotnet.js"

      - name: Patch base href for GitHub Pages
        working-directory:
          "examples/Web Applications/Framework
          Examples/Blazor/BlazorWasmAuthExample"
        run: |
          sed -i 's|<head>|<head>\n    <base href="/${{ github.event.repository.name }}/" />|' dist/wwwroot/index.html

      - name: Add .nojekyll and 404.html
        working-directory:
          "examples/Web Applications/Framework
          Examples/Blazor/BlazorWasmAuthExample"
        run: |
          touch dist/wwwroot/.nojekyll
          cp dist/wwwroot/index.html dist/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path:
            "examples/Web Applications/Framework
            Examples/Blazor/BlazorWasmAuthExample/dist/wwwroot"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
